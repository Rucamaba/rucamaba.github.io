<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impostor Fútbol</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #f5f5f0;
      background:
        radial-gradient(ellipse at 30% 20%, #1a4d2e 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, #0d2818 0%, transparent 45%),
        #0a1f14;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      font-family: system-ui, sans-serif;
      font-size: 1.05rem;
      opacity: 0.75;
      max-width: 28rem;
      line-height: 1.5;
      margin: 0 auto 1.75rem;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #0a1f14;
      background: #f5f5f0;
      text-decoration: none;
      padding: 0.85rem 1.4rem;
      border-radius: 0.5rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .play-btn:hover {
      background: #fff;
      transform: translateY(-2px);
    }
    .play-btn svg {
      width: 1.5rem;
      height: 1.5rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Impostor Fútbol</h1>
    <p>Juego de impostores ambientado en el fútbol. Descárgalo en Google Play.</p>
    <a
      class="play-btn"
      href="https://play.google.com/store/apps/details?id=com.jaie.impostorfutbol"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#34A853" d="M3.6 20.5 13.2 12 3.6 3.5v17z"/>
        <path fill="#FBBC04" d="m13.2 12 2.5-2.5 5.2 3c.7.4.7 1.5 0 1.9l-5.2 3-2.5-2.4z"/>
        <path fill="#EA4335" d="M3.6 3.5 13.2 12l2.5-2.5L5.4 2.1C4.4 1.5 3.2 2.3 3.2 3.5c0 0 .1 0 .4 0z"/>
        <path fill="#4285F4" d="M3.6 20.5c-.3 0-.4 0-.4 0 0 1.2 1.2 2 2.2 1.4l10.3-6-2.5-2.4-9.6 7z"/>
      </svg>
      Disponible en Google Play
    </a>
  </main>
</body>
</html>
