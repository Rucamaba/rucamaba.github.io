<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impostor Fútbol</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #f5f5f0;
      background:
        radial-gradient(ellipse at 30% 20%, #1a4d2e 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, #0d2818 0%, transparent 45%),
        #0a1f14;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      font-family: system-ui, sans-serif;
      font-size: 1.05rem;
      opacity: 0.75;
      max-width: 28rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Impostor Fútbol</h1>
    <p>Juego de impostores ambientado en el fútbol. Encuéntranos en Google Play.</p>
  </main>
</body>
</html>
